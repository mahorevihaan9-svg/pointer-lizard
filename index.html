<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pointer Lizard</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #17191b; }
    body {
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #eef2ed;
    }
    canvas { display: block; width: 100vw; height: 100vh; cursor: none; }
    .brand {
      position: fixed; inset: 24px auto auto 26px; z-index: 2; pointer-events: none;
      text-shadow: 0 1px 18px rgba(0, 0, 0, .42);
    }
    .brand p { margin: 0 0 5px; color: rgba(220, 232, 221, .52); font-size: 11px; letter-spacing: .13em; text-transform: uppercase; }
    .brand h1 { margin: 0; color: rgba(238, 245, 238, .92); font-size: 15px; font-weight: 540; letter-spacing: -.015em; }
    .brand span { display: block; margin-top: 5px; color: rgba(222, 232, 223, .54); font-size: 12px; }
    .settings-toggle {
      position: fixed; z-index: 3; top: 20px; right: 22px;
      display: inline-flex; align-items: center; gap: 8px; padding: 9px 11px;
      border: 1px solid rgba(215, 230, 218, .16); border-radius: 9px;
      background: rgba(25, 30, 27, .72); color: rgba(240, 246, 241, .9);
      backdrop-filter: blur(14px); font: inherit; font-size: 12px; cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }
    .settings-toggle:hover, .settings-toggle[aria-expanded="true"] { background: rgba(47, 59, 51, .88); border-color: rgba(214, 236, 215, .36); }
    .settings-toggle:active { transform: translateY(1px); }
    .settings-toggle svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.65; }
    .settings-panel {
      position: fixed; z-index: 2; top: 66px; right: 22px; width: 238px; padding: 13px;
      border: 1px solid rgba(215, 230, 218, .15); border-radius: 12px;
      background: rgba(25, 30, 27, .89); box-shadow: 0 14px 48px rgba(0, 0, 0, .28);
      backdrop-filter: blur(16px);
      max-height: calc(100vh - 86px); overflow-y: auto; overscroll-behavior: contain;
    }
    .settings-panel[hidden] { display: none; }
    .panel-title { margin: 0 0 10px; color: rgba(221, 235, 223, .62); font-size: 10px; letter-spacing: .13em; text-transform: uppercase; }
    .mode {
      width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px;
      border: 1px solid transparent; border-radius: 8px; background: transparent; color: rgba(239, 245, 239, .74);
      font: inherit; text-align: left; cursor: pointer; transition: background .18s ease, border-color .18s ease, color .18s ease;
    }
    .mode + .mode { margin-top: 5px; }
    .mode:hover { background: rgba(235, 248, 236, .06); color: #f1f8f1; }
    .mode[aria-pressed="true"] { border-color: rgba(180, 219, 181, .27); background: rgba(113, 150, 111, .16); color: #f5fbf5; }
    .mode-name { font-size: 13px; font-weight: 560; }
    .mode-state { align-self: center; width: 7px; height: 7px; border-radius: 50%; background: rgba(226, 235, 225, .26); }
    .mode[aria-pressed="true"] .mode-state { background: #b9dc9e; box-shadow: 0 0 0 3px rgba(185, 220, 158, .11); }
    .mode-detail { grid-column: 1 / -1; color: rgba(222, 234, 222, .49); font-size: 11px; line-height: 1.35; }
    .panel-section { margin-top: 12px; padding-top: 11px; border-top: 1px solid rgba(219, 235, 220, .1); }
    .field-label, .advanced summary { color: rgba(221, 235, 223, .62); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; }
    .select-field { display: block; }
    .select-field .field-label { display: block; margin-bottom: 7px; }
    .select-field select {
      width: 100%; padding: 8px 9px; border: 1px solid rgba(215, 230, 218, .17); border-radius: 7px;
      background: rgba(235, 248, 236, .055); color: rgba(241, 247, 241, .88); font: inherit; font-size: 12px;
    }
    .advanced { margin-top: 12px; padding-top: 11px; border-top: 1px solid rgba(219, 235, 220, .1); }
    .advanced summary { cursor: pointer; list-style: none; }
    .advanced summary::-webkit-details-marker { display: none; }
    .advanced summary::after { content: "+"; float: right; font-size: 14px; line-height: 8px; color: rgba(222, 236, 222, .62); }
    .advanced[open] summary::after { content: "−"; }
    .advanced-content { padding-top: 11px; }
    .range-row + .range-row { margin-top: 11px; }
    .range-top { display: flex; justify-content: space-between; gap: 10px; color: rgba(232, 241, 232, .76); font-size: 11px; }
    .range-top output { color: rgba(188, 218, 172, .9); font-variant-numeric: tabular-nums; }
    input[type="range"] { width: 100%; margin: 7px 0 0; accent-color: #b9dc9e; }
    .color-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 11px; }
    .color-field { display: grid; gap: 5px; color: rgba(222, 234, 222, .56); font-size: 10px; text-align: center; }
    input[type="color"] { width: 100%; height: 28px; padding: 2px; border: 1px solid rgba(215, 230, 218, .16); border-radius: 6px; background: transparent; cursor: pointer; }
    .reset {
      width: 100%; margin-top: 12px; padding: 8px 9px; border: 1px solid rgba(215, 230, 218, .16); border-radius: 7px;
      background: rgba(235, 248, 236, .045); color: rgba(236, 244, 236, .75); font: inherit; font-size: 12px; cursor: pointer;
      transition: background .18s ease, border-color .18s ease;
    }
    .reset:hover { background: rgba(235, 248, 236, .1); border-color: rgba(215, 230, 218, .3); }
    .panel-note { margin: 12px 1px 0; padding-top: 10px; border-top: 1px solid rgba(219, 235, 220, .1); color: rgba(218, 232, 219, .42); font-size: 11px; line-height: 1.45; }
    .footer-note { position: fixed; z-index: 2; right: 24px; bottom: 19px; color: rgba(218, 231, 219, .38); font-size: 11px; pointer-events: none; }
    @media (max-width: 520px) {
      .brand { inset: 18px auto auto 18px; }
      .settings-toggle { top: 15px; right: 15px; }
      .settings-panel { top: 60px; right: 15px; width: min(238px, calc(100vw - 30px)); }
      .footer-note { right: 18px; bottom: 14px; }
    }
  </style>
</head>
<body>
  <canvas id="scene" aria-label="An animated lizard follows the pointer"></canvas>
  <header class="brand">
    <p>Interactive motion study</p>
    <h1>Pointer lizard</h1>
    <span>Guide it with the pointer</span>
  </header>
  <button class="settings-toggle" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsPanel">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M8 14v6"/></svg>
    Appearance
  </button>
  <aside class="settings-panel" id="settingsPanel" hidden aria-label="Appearance settings">
    <p class="panel-title">Render mode</p>
    <button class="mode" type="button" data-mode="skin" aria-pressed="true">
      <span class="mode-name">Skin</span><span class="mode-state" aria-hidden="true"></span>
      <span class="mode-detail">Layered scales, musculature, gloss, eyes, and claws.</span>
    </button>
    <button class="mode" type="button" data-mode="skeleton" aria-pressed="false">
      <span class="mode-name">Skeletal anatomy</span><span class="mode-state" aria-hidden="true"></span>
      <span class="mode-detail">Articulated skull, vertebrae, ribs, girdles, and phalanges.</span>
    </button>
    <div class="panel-section">
      <label class="select-field" for="styleSelect">
        <span class="field-label">Skin style</span>
        <select id="styleSelect">
          <option value="forest">Forest monitor</option>
          <option value="desert">Desert skink</option>
          <option value="obsidian">Obsidian gecko</option>
          <option value="rainforest">Rainforest anole</option>
        </select>
      </label>
    </div>
    <details class="advanced">
      <summary>Advanced tuning</summary>
      <div class="advanced-content">
        <label class="range-row"><span class="range-top">Follow speed <output data-output-for="motionSpeed">100%</output></span><input id="motionSpeed" type="range" min="55" max="145" value="100"></label>
        <label class="range-row"><span class="range-top">Spine flexibility <output data-output-for="spineFlex">52%</output></span><input id="spineFlex" type="range" min="15" max="100" value="52"></label>
        <label class="range-row"><span class="range-top">Step length <output data-output-for="stepLength">100%</output></span><input id="stepLength" type="range" min="65" max="145" value="100"></label>
        <label class="range-row"><span class="range-top">Shadow opacity <output data-output-for="shadowOpacity">18%</output></span><input id="shadowOpacity" type="range" min="0" max="50" value="18"></label>
        <label class="range-row"><span class="range-top">Shadow softness <output data-output-for="shadowSoftness">11px</output></span><input id="shadowSoftness" type="range" min="0" max="30" value="11"></label>
        <label class="range-row"><span class="range-top">Grid strength <output data-output-for="gridOpacity">6%</output></span><input id="gridOpacity" type="range" min="0" max="18" value="6"></label>
        <span class="field-label" style="display:block; margin-top:13px;">Background colors</span>
        <div class="color-grid">
          <label class="color-field">Base<input id="backgroundColor" type="color" value="#17191b"></label>
          <label class="color-field">Grid<input id="gridColor" type="color" value="#d2dfda"></label>
          <label class="color-field">Glow<input id="ambientColor" type="color" value="#45634a"></label>
        </div>
      </div>
    </details>
    <button class="reset" id="resetSettings" type="button">Reset to defaults</button>
    <p class="panel-note">Both modes use the same flexible spine and planted-foot gait.</p>
  </aside>
  <div class="footer-note" id="modeLabel">Skin render</div>

  <script>
    const canvas = document.getElementById("scene");
    const ctx = canvas.getContext("2d");
    const settingsToggle = document.getElementById("settingsToggle");
    const settingsPanel = document.getElementById("settingsPanel");
    const modeButtons = [...document.querySelectorAll("[data-mode]")];
    const modeLabel = document.getElementById("modeLabel");
    const styleSelect = document.getElementById("styleSelect");
    const resetSettingsButton = document.getElementById("resetSettings");
    const tuningInputs = [...document.querySelectorAll("input[type=range], input[type=color]")];
    const TAU = Math.PI * 2;
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const lerp = (a, b, amount) => a + (b - a) * amount;
    const smooth = t => t * t * (3 - 2 * t);
    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
    const angleDelta = (a, b) => Math.atan2(Math.sin(b - a), Math.cos(b - a));
    const unit = (x, y) => {
      const length = Math.hypot(x, y) || 1;
      return { x: x / length, y: y / length };
    };

    let W = 0, H = 0, dpr = 1, renderAlpha = 1;
    const target = { x: 0, y: 0, active: false };
    const view = { mode: "skin", skinMix: 1 };
    const defaults = Object.freeze({
      style: "forest",
      motionSpeed: 100,
      spineFlex: 52,
      stepLength: 100,
      shadowOpacity: 18,
      shadowSoftness: 11,
      gridOpacity: 6,
      backgroundColor: "#17191b",
      gridColor: "#d2dfda",
      ambientColor: "#45634a"
    });
    const tuning = { ...defaults };
    const palettes = {
      forest: {
        coat: ["#667d50", "#758c58", "#3f573e", "#304632", "#223329"],
        limbFront: "#4b6746", limbRear: "#536d49", limbLower: "#486142",
        limbLight: "rgba(199,214,144,.31)", scaleLight: "#718b58", scaleMid: "#526d49", scaleEdge: "#2a3c2d",
        head: ["#789159", "#3f573d", "#26362b"], scutes: ["#718b57", "#617b4e", "#4d6741", "#49613d", "#809663", "#708a57"],
        flankDark: "#31472f", flankLight: "#83945d", highlight: "#d9e8a7", eye: ["#f4d87d", "#9fba53", "#36451f"]
      },
      desert: {
        coat: ["#a9845c", "#c69b64", "#7f5d3f", "#58442f", "#3c3026"],
        limbFront: "#8a633f", limbRear: "#9a7044", limbLower: "#735439",
        limbLight: "rgba(239,203,133,.3)", scaleLight: "#bc925f", scaleMid: "#8d6643", scaleEdge: "#4b392b",
        head: ["#c69a63", "#805d3e", "#4e392b"], scutes: ["#b88e5b", "#9d7449", "#755239", "#684733", "#c29c69", "#a67d51"],
        flankDark: "#5d432e", flankLight: "#c9a36a", highlight: "#f3d599", eye: ["#f4d57a", "#bc7d32", "#573817"]
      },
      obsidian: {
        coat: ["#405057", "#52666a", "#253238", "#1b252a", "#121a1d"],
        limbFront: "#35464c", limbRear: "#3c5053", limbLower: "#2d3d42",
        limbLight: "rgba(147,205,205,.28)", scaleLight: "#5d7376", scaleMid: "#3b4f53", scaleEdge: "#182529",
        head: ["#596d70", "#2d3e43", "#172126"], scutes: ["#596f71", "#445a5d", "#334549", "#2a3a3e", "#647c7e", "#4a6264"],
        flankDark: "#26383b", flankLight: "#729393", highlight: "#b9e2d6", eye: ["#d6f1ae", "#75bc8c", "#1c3b32"]
      },
      rainforest: {
        coat: ["#4c8566", "#67a475", "#285a4b", "#1c4339", "#16342e"],
        limbFront: "#367458", limbRear: "#438363", limbLower: "#2d654f",
        limbLight: "rgba(172,237,167,.31)", scaleLight: "#66a770", scaleMid: "#3b7a5a", scaleEdge: "#1b493b",
        head: ["#5aa070", "#2b6a52", "#184537"], scutes: ["#5d9e6e", "#438461", "#2b6c50", "#245a44", "#70b67a", "#4a9467"],
        flankDark: "#20513f", flankLight: "#9fcf75", highlight: "#c5edaa", eye: ["#f2d977", "#8dca54", "#244b25"]
      }
    };
    const lizard = {
      head: { x: 0, y: 0 }, heading: -.16, speed: 0, turnVelocity: 0, ready: false,
      chain: [], feet: [], gaitDistance: 0, trail: [], breath: 0,
      blinkClock: 0, blinkAt: 3.8, blink: 0
    };
    const bodyWidths = [16, 22, 28, 32, 35, 37, 38, 38, 36, 34, 32, 30, 27, 24, 21, 17, 14, 11, 8.5, 6, 4, 2.6, 1.3];
    // Generic squamate proportions: shorter forelimbs, larger hindlimbs, five digits each.
    const legs = [
      { spine: 4, side: -1, fore: 18, slot: 0, front: true, upper: 29, lower: 36 },
      { spine: 4, side: 1, fore: 18, slot: 2, front: true, upper: 29, lower: 36 },
      { spine: 10, side: -1, fore: -17, slot: 3, front: false, upper: 36, lower: 42 },
      { spine: 10, side: 1, fore: -17, slot: 1, front: false, upper: 36, lower: 42 }
    ];
    function palette() { return palettes[tuning.style]; }
    function rgba(hex, alpha) {
      const value = hex.replace("#", "");
      const expanded = value.length === 3 ? value.split("").map(part => part + part).join("") : value;
      const number = parseInt(expanded, 16);
      return "rgba(" + ((number >> 16) & 255) + "," + ((number >> 8) & 255) + "," + (number & 255) + "," + alpha + ")";
    }

    function resize() {
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!lizard.ready) {
        lizard.head.x = W * .47; lizard.head.y = H * .54;
        target.x = W * .67; target.y = H * .44;
      }
    }
    function poseAt(index) {
      const p = lizard.chain[index];
      let direction;
      if (index === 0) direction = { x: Math.cos(lizard.heading), y: Math.sin(lizard.heading) };
      else if (index === lizard.chain.length - 1) {
        const previous = lizard.chain[index - 1];
        direction = unit(previous.x - p.x, previous.y - p.y);
      } else {
        const previous = lizard.chain[index - 1], next = lizard.chain[index + 1];
        direction = unit(previous.x - next.x, previous.y - next.y);
      }
      return { p, d: direction, n: { x: -direction.y, y: direction.x } };
    }
    function offset(pose, forward = 0, side = 0) {
      return {
        x: pose.p.x + pose.d.x * forward + pose.n.x * side,
        y: pose.p.y + pose.d.y * forward + pose.n.y * side
      };
    }
    function footHome(leg) {
      const pose = poseAt(leg.spine);
      const hip = offset(pose, 0, leg.side * (leg.front ? 13 : 16));
      const spread = leg.front ? 48 : 53;
      return {
        hip, pose,
        point: {
          x: hip.x + pose.d.x * leg.fore + pose.n.x * leg.side * spread,
          y: hip.y + pose.d.y * leg.fore + pose.n.y * leg.side * spread
        }
      };
    }
    function resetFoot(index) {
      const point = footHome(legs[index]).point;
      lizard.feet[index] = {
        current: { ...point }, start: { ...point }, target: { ...point },
        t: 1, lift: 0, stepping: false, lastSlot: -1
      };
    }
    function init() {
      resize();
      lizard.chain = Array.from({ length: bodyWidths.length }, (_, index) => ({
        x: lizard.head.x - index * 12 * Math.cos(lizard.heading),
        y: lizard.head.y - index * 12 * Math.sin(lizard.heading)
      }));
      for (let i = 0; i < legs.length; i++) resetFoot(i);
      lizard.ready = true;
    }

    function updateHead(dt) {
      const dx = target.x - lizard.head.x, dy = target.y - lizard.head.y;
      const gap = Math.hypot(dx, dy);
      const wantedHeading = Math.atan2(dy, dx);
      const speedScale = tuning.motionSpeed / 100;
      const maxYaw = 2.05 * (0.72 + speedScale * .28);
      const wantedYaw = clamp(angleDelta(lizard.heading, wantedHeading) * 4.2, -maxYaw, maxYaw);
      lizard.turnVelocity += (wantedYaw - lizard.turnVelocity) * (1 - Math.exp(-8.5 * dt));
      lizard.heading += lizard.turnVelocity * dt;
      const desiredSpeed = clamp((gap - 38) * 1.38 * speedScale, 0, 152 * speedScale);
      lizard.speed += (desiredSpeed - lizard.speed) * (1 - Math.exp(-4.6 * dt));
      lizard.head.x += Math.cos(lizard.heading) * lizard.speed * dt;
      lizard.head.y += Math.sin(lizard.heading) * lizard.speed * dt;
    }
    function bendSpine(dt) {
      lizard.chain[0].x = lizard.head.x;
      lizard.chain[0].y = lizard.head.y;
      const motion = clamp(lizard.speed / (152 * tuning.motionSpeed / 100), 0, 1);
      const turnBias = clamp(lizard.turnVelocity / 2.05, -1, 1);
      const flex = tuning.spineFlex / 52;
      for (let pass = 0; pass < 4; pass++) {
        for (let i = 1; i < lizard.chain.length; i++) {
          const ahead = lizard.chain[i - 1], here = lizard.chain[i];
          const base = unit(ahead.x - here.x, ahead.y - here.y);
          const trailing = Math.min(i, 15) / 15;
          const wave = Math.sin(lizard.gaitDistance * .046 - i * .54) * motion * (.006 + trailing * .032) * flex;
          const directionalBend = turnBias * trailing * .052 * flex;
          const bend = wave + directionalBend;
          const cosine = Math.cos(bend), sine = Math.sin(bend);
          const direction = { x: base.x * cosine - base.y * sine, y: base.x * sine + base.y * cosine };
          const desired = { x: ahead.x - direction.x * 12, y: ahead.y - direction.y * 12 };
          const follow = clamp(dt * (17.8 - i * .55), .035, .33);
          here.x += (desired.x - here.x) * follow;
          here.y += (desired.y - here.y) * follow;
        }
      }
    }
    function startStep(index, slot) {
      const leg = legs[index], foot = lizard.feet[index], home = footHome(leg);
      const stepScale = tuning.stepLength / 100;
      const stride = clamp((22 + lizard.speed * .15) * stepScale, 28 * stepScale, (leg.front ? 47 : 54) * stepScale);
      foot.start = { ...foot.current };
      const lead = leg.front ? stride : stride * .76;
      foot.target = { x: home.point.x + home.pose.d.x * lead, y: home.point.y + home.pose.d.y * lead };
      foot.t = 0; foot.lift = 0; foot.stepping = true; foot.lastSlot = slot;
    }
    function updateFeet(dt) {
      const moving = lizard.speed > 18;
      const slot = Math.floor(lizard.gaitDistance / (21 * tuning.stepLength / 100));
      const active = slot % 4;
      let airborne = lizard.feet.findIndex(foot => foot.stepping);
      if (moving && airborne === -1) {
        const candidates = legs.map((leg, i) => {
          const foot = lizard.feet[i];
          const reach = dist(foot.current, footHome(leg).point);
          return { i, reach, scheduled: leg.slot === active && foot.lastSlot !== slot };
        });
        const scheduled = candidates.find(candidate => candidate.scheduled && candidate.reach > 17);
        const emergency = candidates.reduce((best, candidate) => candidate.reach > best.reach ? candidate : best, candidates[0]);
        const choice = scheduled || (emergency.reach > 49 ? emergency : null);
        if (choice) {
          startStep(choice.i, slot);
          airborne = choice.i;
        }
      }
      for (let i = 0; i < legs.length; i++) {
        const foot = lizard.feet[i];
        if (!foot.stepping) continue;
        foot.t = clamp(foot.t + dt * (5.1 + lizard.speed * .006), 0, 1);
        const p = smooth(foot.t);
        foot.current.x = lerp(foot.start.x, foot.target.x, p);
        foot.current.y = lerp(foot.start.y, foot.target.y, p);
        foot.lift = Math.sin(foot.t * Math.PI) * (10 + lizard.speed * .024);
        if (foot.t === 1) { foot.stepping = false; foot.lift = 0; }
      }
    }
    function updateBlink(dt) {
      lizard.blinkClock += dt;
      if (lizard.blinkClock > lizard.blinkAt) {
        const phase = lizard.blinkClock - lizard.blinkAt;
        lizard.blink = phase < .15 ? Math.sin(phase / .15 * Math.PI) : 0;
        if (phase > .15) {
          lizard.blinkClock = 0;
          lizard.blinkAt = 3.4 + Math.random() * 3.8;
        }
      } else lizard.blink = 0;
    }
    function update(dt) {
      updateHead(dt);
      lizard.gaitDistance += lizard.speed * dt;
      lizard.breath += dt * (lizard.speed > 20 ? 2.3 : .78);
      bendSpine(dt);
      updateFeet(dt);
      updateBlink(dt);
      view.skinMix += ((view.mode === "skin" ? 1 : 0) - view.skinMix) * (1 - Math.exp(-7 * dt));
      const center = lizard.chain[8];
      lizard.trail.push({ x: center.x, y: center.y });
      if (lizard.trail.length > 28) lizard.trail.shift();
    }

    function line(a, b, color, width = 1, alpha = 1) {
      ctx.globalAlpha = alpha * renderAlpha; ctx.strokeStyle = color; ctx.lineWidth = width;

      setMode("skin");
    }
    function setPanel(open) {
      settingsPanel.hidden = !open;
      settingsToggle.setAttribute("aria-expanded", String(open));
    }

    settingsToggle.addEventListener("click", () => setPanel(settingsPanel.hidden));
    modeButtons.forEach(button => button.addEventListener("click", () => setMode(button.dataset.mode)));
    styleSelect.addEventListener("change", () => { tuning.style = styleSelect.value; });
    tuningInputs.forEach(input => input.addEventListener("input", () => applyInput(input)));
    resetSettingsButton.addEventListener("click", resetSettings);
    document.addEventListener("pointerdown", event => {
      if (!settingsPanel.hidden && !settingsPanel.contains(event.target) && !settingsToggle.contains(event.target)) setPanel(false);
    });
    window.addEventListener("keydown", event => { if (event.key === "Escape") setPanel(false); });
    window.addEventListener("resize", resize);
    canvas.addEventListener("pointermove", event => setTarget(event.clientX, event.clientY));
    canvas.addEventListener("pointerdown", event => setTarget(event.clientX, event.clientY));
    canvas.addEventListener("touchmove", event => {
      const touch = event.touches[0];
      if (touch) setTarget(touch.clientX, touch.clientY);
    }, { passive: true });

    resetSettings();
    init();
    setTarget(W * .68, H * .45);
    requestAnimationFrame(frame);
  </script>
</body>
</html>
